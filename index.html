<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SM Online Shop - Beauty & Lifestyle</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX compilation in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-pink-50/30 text-gray-800 font-sans pb-12">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { 
          ShoppingBag, Trash2, Plus, Minus, Search, 
          ShieldCheck, Truck, RefreshCw, Star, ArrowRight, X, Menu, Settings, Heart, Sparkles, Facebook, Instagram, MessageCircle, CheckCircle2, Printer, Camera, Lock, Key, Shield, Radio, Users, Eye, Send
        } = lucide;

        function App() {
          const [activeTab, setActiveTab] = useState('shop');
          const [cart, setCart] = useState(() => {
            const saved = localStorage.getItem('sm_cart');
            return saved ? JSON.parse(saved) : [];
          });
          const [wishlist, setWishlist] = useState(() => {
            const saved = localStorage.getItem('sm_wishlist');
            return saved ? JSON.parse(saved) : [];
          });
          const [searchQuery, setSearchQuery] = useState('');
          const [selectedCategory, setSelectedCategory] = useState('All');
          const [checkoutModal, setCheckoutModal] = useState(false);

          const [customerName, setCustomerName] = useState('');
          const [customerPhone, setCustomerPhone] = useState('');
          const [customerAddress, setCustomerAddress] = useState('');

          const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
          const [adminUsername, setAdminUsername] = useState('');
          const [adminPassword, setAdminPassword] = useState('');
          const [adminPin, setAdminPin] = useState('');
          const [loginError, setLoginError] = useState('');

          const [isChatOpen, setIsChatOpen] = useState(false);
          const [chatMessages, setChatMessages] = useState([
            { sender: 'support', text: 'আসসালামু আলাইকুম! SM Online Shop-এ আপনাকে স্বাগতম। পেমেন্ট, ডেলিভারি বা যেকোনো প্রশ্ন করতে পারেন। 🌸' }
          ]);
          const [chatInput, setChatInput] = useState('');
          const [chatImagePreview, setChatImagePreview] = useState(null);

          const [products, setProducts] = useState([
            {
              id: 1,
              name: 'Premium Chiffon Hijab with Inner Cap',
              price: 650,
              category: 'Hijab & Abaya',
              image: 'https://images.unsplash.com/photo-1584273143981-41c073dfe8f8?auto=format&fit=crop&w=600&q=80',
            },
            {
              id: 2,
              name: 'Embroidered Black Designer Abaya',
              price: 3200,
              category: 'Hijab & Abaya',
              image: 'https://images.unsplash.com/photo-1617627143750-d86bc21e42bb?auto=format&fit=crop&w=600&q=80',
            }
          ]);

          const [zoomedImage, setZoomedImage] = useState(null);

          useEffect(() => {
            localStorage.setItem('sm_cart', JSON.stringify(cart));
          }, [cart]);

          useEffect(() => {
            localStorage.setItem('sm_wishlist', JSON.stringify(wishlist));
          }, [wishlist]);

          const addToCart = (product) => {
            setCart(prev => {
              const existing = prev.find(item => item.id === product.id);
              if (existing) {
                return prev.map(item => item.id === product.id ? { ...item, quantity: item.quantity + 1 } : item);
              }
              return [...prev, { ...product, quantity: 1 }];
            });
            alert('কার্ডে সফলভাবে যোগ করা হয়েছে!');
          };

          const subtotal = cart.reduce((acc, item) => acc + (item.price * item.quantity), 0);
          const shipping = subtotal > 0 ? 120 : 0;
          const total = subtotal + shipping;

          return (
            <div className="min-h-screen flex flex-col justify-between">
              <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-pink-100 shadow-sm">
                <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
                  <div onClick={() => setActiveTab('shop')} className="cursor-pointer flex items-center gap-2.5">
                    <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-pink-500 to-rose-500 text-white font-black flex items-center justify-center text-xl shadow-md">
                      SM
                    </div>
                    <div>
                      <span className="font-black text-lg tracking-tight text-pink-600">SM Online Shop</span>
                      <span className="block text-[10px] font-bold text-pink-400 uppercase -mt-1">Beauty & Lifestyle</span>
                    </div>
                  </div>
                  <div className="flex items-center gap-2">
                    <button onClick={() => setActiveTab('shop')} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${activeTab === 'shop' ? 'bg-pink-600 text-white' : 'bg-pink-50 text-pink-600'}`}>শপ</button>
                    <button onClick={() => setActiveTab('cart')} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${activeTab === 'cart' ? 'bg-pink-600 text-white' : 'bg-pink-50 text-pink-600'}`}>কার্ট ({cart.reduce((a,b)=>a+b.quantity,0)})</button>
                    <button onClick={() => setActiveTab('admin')} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${activeTab === 'admin' ? 'bg-pink-600 text-white' : 'bg-pink-50 text-pink-600'}`}>অ্যাডমিন</button>
                  </div>
                </div>
              </header>

              <main className="max-w-7xl mx-auto px-4 pt-6 flex-1 w-full space-y-6">
                {activeTab === 'shop' && (
                  <div className="space-y-6">
                    <div className="rounded-3xl bg-gradient-to-r from-pink-500 to-rose-500 text-white p-6 shadow-xl">
                      <h1 className="text-2xl font-black">আপনার সৌন্দর্যে যোগ করুন নতুন মাত্রা! ✨</h1>
                      <p className="text-xs text-pink-100 mt-2">প্রিমিয়াম হিজাব, আবায়া ও ১০০% অরজিনাল কসমেটিকস।</p>
                    </div>
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                      {products.map(product => (
                        <div key={product.id} className="bg-white rounded-3xl border border-pink-100 overflow-hidden shadow-sm flex flex-col justify-between">
                          <div className="aspect-square bg-pink-50 cursor-pointer overflow-hidden" onClick={() => setZoomedImage(product.image)}>
                            <img src={product.image} alt={product.name} className="w-full h-full object-cover hover:scale-105 transition-transform" />
                          </div>
                          <div className="p-3 space-y-1">
                            <h3 className="font-bold text-xs text-gray-800 truncate">{product.name}</h3>
                            <p className="font-black text-rose-600 text-sm">৳{product.price}</p>
                          </div>
                          <div className="p-3 pt-0">
                            <button onClick={() => addToCart(product)} className="w-full bg-pink-600 text-white font-bold py-2 rounded-xl text-xs">কার্টে যোগ করুন</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {activeTab === 'cart' && (
                  <div className="max-w-xl mx-auto bg-white p-6 rounded-3xl border shadow-sm space-y-4">
                    <h2 className="text-xl font-black">আপনার শপিং কার্ট</h2>
                    {cart.length === 0 ? <p className="text-xs text-gray-500">কার্ট খালি।</p> : (
                      <div className="space-y-4">
                        {cart.map(item => (
                          <div key={item.id} className="flex justify-between items-center border-b pb-2 text-xs">
                            <span>{item.name} (x{item.quantity})</span>
                            <span className="font-black text-rose-600">৳{item.price * item.quantity}</span>
                          </div>
                        ))}
                        <div className="flex justify-between font-black text-base pt-2">
                          <span>সর্বমোট:</span>
                          <span className="text-rose-600">৳{total}</span>
                        </div>
                        <button onClick={() => setCheckoutModal(true)} className="w-full bg-pink-600 text-white font-bold py-3 rounded-2xl text-xs">অর্ডার কনফার্ম করুন</button>
                      </div>
                    )}
                  </div>
                )}

                {activeTab === 'admin' && (
                  <div className="max-w-md mx-auto bg-white p-6 rounded-3xl border shadow-sm space-y-4">
                    <h2 className="text-xl font-black">অ্যাডমিন লগইন</h2>
                    {!isAdminLoggedIn ? (
                      <form onSubmit={(e) => {
                        e.preventDefault();
                        if (adminUsername === 'SMADMIN' && adminPassword === 'SM2728' && adminPin === '5035') {
                          setIsAdminLoggedIn(true);
                        } else {
                          setLoginError('ভুল তথ্য বা সিকিউরিটি পিন!');
                        }
                      }} className="space-y-3 text-xs">
                        {loginError && <p className="text-rose-500 font-bold">{loginError}</p>}
                        <input type="text" placeholder="ইউজার আইডি (SMADMIN)" value={adminUsername} onChange={e=>setAdminUsername(e.target.value)} className="w-full p-3 border rounded-xl" required />
                        <input type="password" placeholder="পাসওয়ার্ড (SM2728)" value={adminPassword} onChange={e=>setAdminPassword(e.target.value)} className="w-full p-3 border rounded-xl" required />
                        <input type="password" placeholder="2FA পিন (5035)" maxLength={4} value={adminPin} onChange={e=>setAdminPin(e.target.value)} className="w-full p-3 border rounded-xl text-center font-black tracking-widest" required />
                        <button type="submit" className="w-full bg-pink-600 text-white py-3 rounded-xl font-bold">লগইন</button>
                      </form>
                    ) : (
                      <div className="text-center space-y-3">
                        <p className="text-emerald-600 font-bold text-sm">সফলভাবে লগইন হয়েছে! (Secured)</p>
                        <button onClick={() => setIsAdminLoggedIn(false)} className="bg-rose-50 text-rose-600 px-4 py-2 rounded-xl text-xs font-bold">
